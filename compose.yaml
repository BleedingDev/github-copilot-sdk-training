name: github-copilot-sdk-training

services:
  lab:
    build:
      context: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      - lab-node-modules:/workspace/node_modules
      - lab-copilot-home:/root/.copilot
    environment:
      COPILOT_MODEL: ${COPILOT_MODEL:-gpt-5.2-codex}
      COPILOT_TIMEOUT_MS: ${COPILOT_TIMEOUT_MS:-180000}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    command: ["pnpm", "run", "lab:help"]

volumes:
  lab-node-modules:
  lab-copilot-home:
