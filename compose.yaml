name: github-copilot-sdk-training

services:
  lab:
    build:
      context: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      - lab-node-modules:/workspace/node_modules
      - lab-copilot-home:/root/.copilot
    environment:
      COPILOT_MODEL: ${COPILOT_MODEL:-gpt-5-mini}
      COPILOT_TIMEOUT_MS: ${COPILOT_TIMEOUT_MS:-180000}
      COPILOT_START_TIMEOUT_MS: ${COPILOT_START_TIMEOUT_MS:-30000}
      COPILOT_FLEET_TIMEOUT_MS: ${COPILOT_FLEET_TIMEOUT_MS:-180000}
      COPILOT_FLEET_POLL_MS: ${COPILOT_FLEET_POLL_MS:-5000}
      COPILOT_FLEET_IDLE_GRACE_MS: ${COPILOT_FLEET_IDLE_GRACE_MS:-30000}
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    command: ["pnpm", "run", "lab:help"]

volumes:
  lab-node-modules:
  lab-copilot-home:
