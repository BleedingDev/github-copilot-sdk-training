[env]
COPILOT_MODEL = "gpt-5.2-codex"
COPILOT_TIMEOUT_MS = "180000"
COPILOT_START_TIMEOUT_MS = "30000"
COPILOT_FLEET_TIMEOUT_MS = "180000"
COPILOT_FLEET_POLL_MS = "5000"
COPILOT_FLEET_IDLE_GRACE_MS = "30000"
COPILOT_EVENT_LOG = "compact"
NODE_OPTIONS = "--no-deprecation"

[tasks.setup]
description = "Nainstaluje pnpm závislosti přes lockfile."
run = "bash -lc 'proto install && eval \"$(proto activate bash --export)\" && pnpm install --frozen-lockfile'"

[tasks.verify]
description = "Spustí TypeScript typecheck a unit testy."
depends = ["setup"]
run = "bash -lc 'eval \"$(proto activate bash --export)\" && pnpm run verify'"

[tasks.start]
description = "Rychlý start pro účastníka: setup, help a dry-run."
depends = ["setup"]
run = "bash -lc 'eval \"$(proto activate bash --export)\" && pnpm run lab:help && pnpm run lab:dry-run'"

[tasks."lab:help"]
description = "Vypíše nápovědu aktuálního cvičení."
run = "bash -lc 'eval \"$(proto activate bash --export)\" && pnpm run lab:help'"

[tasks."lab:dry-run"]
description = "Vypíše cíl aktuálního cvičení bez volání Copilota."
run = "bash -lc 'eval \"$(proto activate bash --export)\" && pnpm run lab:dry-run'"

[tasks."lab:models"]
description = "Vypíše modely dostupné pro aktuální Copilot účet."
depends = ["setup"]
run = "bash -lc 'eval \"$(proto activate bash --export)\" && pnpm run lab models'"

[tasks."lab:challenge"]
description = "Vypíše challenge brief pro LAB-101."
depends = ["setup"]
run = "bash -lc 'eval \"$(proto activate bash --export)\" && pnpm run lab challenge LAB-101'"

[tasks."docker:build"]
description = "Postaví lokální Docker image pro lab."
run = "docker build -t github-copilot-sdk-training ."

[tasks."docker:shell"]
description = "Otevře shell uvnitř Docker image s přimountovaným repozitářem."
run = "docker compose run --rm lab zsh"

[tasks."docker:verify"]
description = "Spustí typecheck a testy uvnitř Dockeru."
run = "docker compose run --rm lab pnpm run verify"

[tasks."docker:lab"]
description = "Spustí lab help uvnitř Dockeru."
run = "docker compose run --rm lab pnpm run lab:help"
